name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - hotfix
      force_deploy:
        description: 'Force deployment (skip some checks)'
        required: false
        default: false
        type: boolean
      rollback_version:
        description: 'Version to rollback to (leave empty for normal deployment)'
        required: false
        type: string

env:
  NODE_VERSION: '18.x'
  PRODUCTION_URL: https://app.storyplatform.com
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: storyplatform/app

jobs:
  # Pre-deployment Validation
  pre-deployment-checks:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    outputs:
      should-deploy: ${{ steps.checks.outputs.should-deploy }}
      staging-validated: ${{ steps.staging.outputs.validated }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate staging environment
        id: staging
        run: |
          # Check if staging is healthy before production deployment
          if curl -f https://staging.storyplatform.com/health; then
            echo "validated=true" >> $GITHUB_OUTPUT
          else
            echo "validated=false" >> $GITHUB_OUTPUT
            echo "❌ Staging environment is not healthy"
            exit 1
          fi

      - name: Check deployment prerequisites
        id: checks
        run: |
          should_deploy="true"
          
          # Check if this is a hotfix or regular deployment
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.environment }}" == "hotfix" ]]; then
              echo "🚨 Hotfix deployment detected"
              should_deploy="true"
            fi
          fi
          
          # For regular deployments, ensure all checks pass
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Check if last staging deployment was successful
            echo "Checking staging deployment status..."
            # Implementation would check staging deployment history
          fi
          
          echo "should-deploy=$should_deploy" >> $GITHUB_OUTPUT

      - name: Security scan verification
        run: |
          # Verify latest security scans passed
          echo "Verifying security scans..."
          # Check Snyk, Trivy, and other security tool results

      - name: Compliance checks
        run: |
          # Run compliance validation
          echo "Running compliance checks..."
          # GDPR, SOC2, and other compliance validations

  # Production Build
  production-build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    if: needs.pre-deployment-checks.outputs.should-deploy == 'true'
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="main-$(date +%Y%m%d)-${GITHUB_SHA:0:8}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --only=production

      - name: Build production application
        run: |
          NODE_ENV=production npm run build
          npm run build:optimize
          npm run generate:manifests

      - name: Run production build tests
        run: npm run test:production-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=prod-
            type=raw,value=production-latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build production Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            NODE_ENV=production
            OPTIMIZE=true

      - name: Sign container image
        uses: cosign/cosign-installer@v3
      
      - name: Sign the published Docker image
        run: |
          cosign sign --yes ${{ steps.meta.outputs.tags }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: 1

      - name: Generate production SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: ./production-sbom.spdx.json

      - name: Upload production SBOM
        uses: actions/upload-artifact@v3
        with:
          name: production-sbom
          path: ./production-sbom.spdx.json

  # Production Security Scanning
  production-security:
    name: Production Security Scan
    runs-on: ubuntu-latest
    needs: production-build

    steps:
      - name: Run comprehensive Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.production-build.outputs.image-tag }}
          format: 'sarif'
          output: 'production-trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'production-trivy-results.sarif'

      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.production-build.outputs.image-tag }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Container signing verification
        run: |
          cosign verify ${{ needs.production-build.outputs.image-tag }}@${{ needs.production-build.outputs.image-digest }}
        env:
          COSIGN_EXPERIMENTAL: 1

  # Database Migration Validation
  database-migration:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: production-build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    environment:
      name: production-db
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate migrations
        run: |
          npm run db:validate-migrations
          npm run db:check-rollback-scripts

      - name: Create database backup
        run: |
          echo "Creating production database backup..."
          # Implementation would create actual backup
          npm run db:backup:production

      - name: Test migration on backup
        run: |
          echo "Testing migration on database backup..."
          # Test migrations on backup before applying to production
          npm run db:test-migration

      - name: Prepare migration rollback
        run: |
          echo "Preparing rollback scripts..."
          npm run db:prepare-rollback

  # Blue-Green Deployment Preparation
  blue-green-prep:
    name: Blue-Green Deployment Prep
    runs-on: ubuntu-latest
    needs: [production-build, production-security, database-migration]

    environment:
      name: production-prep

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name storyplatform-production

      - name: Prepare green environment
        run: |
          # Scale up green environment
          kubectl scale deployment storyplatform-app-green --replicas=3 -n production
          
          # Wait for green environment to be ready
          kubectl rollout status deployment/storyplatform-app-green -n production --timeout=600s

      - name: Health check green environment
        run: |
          # Internal health check for green environment
          kubectl exec -n production deployment/storyplatform-app-green -- curl -f http://localhost:3000/health

  # Production Deployment
  production-deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [blue-green-prep]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name storyplatform-production

      - name: Deploy infrastructure updates
        run: |
          cd infrastructure/production
          terraform init
          terraform plan -var="image_tag=${{ needs.production-build.outputs.image-tag }}"
          terraform apply -auto-approve -var="image_tag=${{ needs.production-build.outputs.image-tag }}"

      - name: Run database migrations
        run: |
          kubectl exec -n production deployment/storyplatform-app-green -- npm run db:migrate:production

      - name: Update green deployment
        run: |
          envsubst < k8s/production/deployment-green.yaml | kubectl apply -f -
        env:
          IMAGE_TAG: ${{ needs.production-build.outputs.image-tag }}
          VERSION: ${{ needs.production-build.outputs.version }}

      - name: Wait for green deployment
        run: |
          kubectl rollout status deployment/storyplatform-app-green -n production --timeout=900s

      - name: Comprehensive health checks
        run: |
          # Internal health check
          kubectl exec -n production deployment/storyplatform-app-green -- curl -f http://localhost:3000/health
          
          # Database connectivity
          kubectl exec -n production deployment/storyplatform-app-green -- curl -f http://localhost:3000/api/status/database
          
          # Cache connectivity
          kubectl exec -n production deployment/storyplatform-app-green -- curl -f http://localhost:3000/api/status/cache
          
          # External services connectivity
          kubectl exec -n production deployment/storyplatform-app-green -- curl -f http://localhost:3000/api/status/external

      - name: Run smoke tests on green
        run: |
          # Get green service endpoint
          GREEN_ENDPOINT=$(kubectl get service storyplatform-app-green -n production -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          
          # Run smoke tests
          curl -f "http://$GREEN_ENDPOINT/api/health"
          curl -f "http://$GREEN_ENDPOINT/api/stories/featured"
          curl -f "http://$GREEN_ENDPOINT/api/communities"

      - name: Switch traffic to green (Blue-Green Switch)
        run: |
          # Update service selector to point to green deployment
          kubectl patch service storyplatform-app -n production -p '{"spec":{"selector":{"version":"green"}}}'
          
          # Verify traffic switch
          sleep 30
          curl -f ${{ env.PRODUCTION_URL }}/health

      - name: Monitor deployment
        run: |
          # Monitor for 5 minutes after switch
          for i in {1..10}; do
            if curl -f ${{ env.PRODUCTION_URL }}/health; then
              echo "Health check $i/10 passed"
            else
              echo "Health check $i/10 failed"
              exit 1
            fi
            sleep 30
          done

      - name: Scale down blue environment
        run: |
          # Keep blue environment for quick rollback, but scale down
          kubectl scale deployment storyplatform-app-blue --replicas=1 -n production

  # Post-deployment Validation
  production-validation:
    name: Production Validation
    runs-on: ubuntu-latest
    needs: production-deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Wait for production stabilization
        run: |
          timeout 600 bash -c 'until curl -f ${{ env.PRODUCTION_URL }}/health; do sleep 10; done'

      - name: Run production smoke tests
        run: npm run test:smoke:production
        env:
          BASE_URL: ${{ env.PRODUCTION_URL }}
          ENVIRONMENT: production

      - name: Run critical path E2E tests
        run: npm run test:e2e:critical
        env:
          BASE_URL: ${{ env.PRODUCTION_URL }}
          ENVIRONMENT: production

      - name: Validate SSL/TLS configuration
        run: |
          # Check SSL certificate
          echo | openssl s_client -servername app.storyplatform.com -connect app.storyplatform.com:443 2>/dev/null | openssl x509 -noout -dates
          
          # Check security headers
          curl -I ${{ env.PRODUCTION_URL }} | grep -E "(Strict-Transport-Security|X-Content-Type-Options|X-Frame-Options)"

      - name: Performance baseline check
        run: |
          # Quick performance check
          response_time=$(curl -o /dev/null -s -w '%{time_total}' ${{ env.PRODUCTION_URL }})
          if (( $(echo "$response_time > 2.0" | bc -l) )); then
            echo "Response time too slow: ${response_time}s"
            exit 1
          fi

      - name: Validate CDN and caching
        run: |
          # Check CDN headers
          curl -I ${{ env.PRODUCTION_URL }}/static/css/main.css | grep -E "(Cache-Control|CloudFront)"
          
          # Validate asset loading
          curl -f ${{ env.PRODUCTION_URL }}/static/js/main.js
          curl -f ${{ env.PRODUCTION_URL }}/static/css/main.css

  # Monitoring and Alerting Setup
  monitoring-setup:
    name: Setup Monitoring
    runs-on: ubuntu-latest
    needs: production-validation

    steps:
      - name: Configure DataDog monitoring
        run: |
          # Update deployment monitoring
          curl -X POST "https://api.datadoghq.com/api/v1/events" \
          -H "Content-Type: application/json" \
          -H "DD-API-KEY: ${{ secrets.DATADOG_API_KEY }}" \
          -d '{
            "title": "Production Deployment",
            "text": "Successfully deployed version ${{ needs.production-build.outputs.version }}",
            "tags": ["deployment", "production", "version:${{ needs.production-build.outputs.version }}"]
          }'

      - name: Update PagerDuty deployment tracking
        run: |
          curl -X POST "https://events.pagerduty.com/v2/change/enqueue" \
          -H "Content-Type: application/json" \
          -d '{
            "routing_key": "${{ secrets.PAGERDUTY_INTEGRATION_KEY }}",
            "payload": {
              "summary": "Production deployment completed",
              "source": "github-actions",
              "custom_details": {
                "version": "${{ needs.production-build.outputs.version }}",
                "environment": "production"
              }
            }
          }'

      - name: Enable production alerts
        run: |
          # Enable specific alerts for new deployment
          echo "Enabling production monitoring alerts..."
          # Implementation would configure monitoring alerts

  # Security Validation
  production-security-validation:
    name: Production Security Validation
    runs-on: ubuntu-latest
    needs: production-validation

    steps:
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: ${{ env.PRODUCTION_URL }}
          fail_action: false

      - name: Run Nuclei security scan
        uses: projectdiscovery/nuclei-action@main
        with:
          target: ${{ env.PRODUCTION_URL }}
          github-report: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate security headers
        run: |
          response=$(curl -I ${{ env.PRODUCTION_URL }})
          
          # Check required security headers
          echo "$response" | grep -q "Strict-Transport-Security" || exit 1
          echo "$response" | grep -q "X-Content-Type-Options" || exit 1
          echo "$response" | grep -q "X-Frame-Options" || exit 1
          echo "$response" | grep -q "Content-Security-Policy" || exit 1

      - name: Check for exposed sensitive information
        run: |
          # Check for common sensitive file exposures
          status_codes=(
            $(curl -s -o /dev/null -w "%{http_code}" ${{ env.PRODUCTION_URL }}/.env)
            $(curl -s -o /dev/null -w "%{http_code}" ${{ env.PRODUCTION_URL }}/config.json)
            $(curl -s -o /dev/null -w "%{http_code}" ${{ env.PRODUCTION_URL }}/.git/config)
          )
          
          for code in "${status_codes[@]}"; do
            if [ "$code" != "404" ] && [ "$code" != "403" ]; then
              echo "Sensitive file exposed with status code: $code"
              exit 1
            fi
          done

  # Rollback Preparation
  rollback-prep:
    name: Prepare Rollback
    runs-on: ubuntu-latest
    needs: production-deploy
    if: always()

    steps:
      - name: Store rollback information
        run: |
          # Store current deployment info for potential rollback
          echo "Storing rollback information..."
          
          # Create rollback script
          cat > rollback.sh << 'EOF'
          #!/bin/bash
          echo "Rolling back to blue environment..."
          kubectl patch service storyplatform-app -n production -p '{"spec":{"selector":{"version":"blue"}}}'
          kubectl scale deployment storyplatform-app-blue --replicas=3 -n production
          echo "Rollback completed"
          EOF
          
          chmod +x rollback.sh

      - name: Upload rollback artifacts
        uses: actions/upload-artifact@v3
        with:
          name: rollback-${{ needs.production-build.outputs.version }}
          path: rollback.sh
          retention-days: 30

  # Post-deployment Tasks
  post-deployment:
    name: Post-deployment Tasks
    runs-on: ubuntu-latest
    needs: [production-validation, monitoring-setup, production-security-validation]
    if: success()

    steps:
      - name: Update deployment documentation
        run: |
          # Update deployment logs and documentation
          echo "Updating deployment documentation..."

      - name: Notify stakeholders
        run: |
          # Send deployment notifications
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          -H 'Content-type: application/json' \
          --data '{
            "channel": "#production-deployments",
            "text": "🚀 Production deployment successful!",
            "attachments": [
              {
                "color": "good",
                "fields": [
                  {
                    "title": "Version",
                    "value": "${{ needs.production-build.outputs.version }}",
                    "short": true
                  },
                  {
                    "title": "Environment",
                    "value": "Production",
                    "short": true
                  },
                  {
                    "title": "URL",
                    "value": "${{ env.PRODUCTION_URL }}",
                    "short": false
                  }
                ]
              }
            ]
          }'

      - name: Create release notes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });
            
            const lastRelease = releases[0];
            const compareUrl = `${context.payload.repository.html_url}/compare/${lastRelease.tag_name}...${context.sha}`;
            
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ needs.production-build.outputs.version }}',
              name: 'Release ${{ needs.production-build.outputs.version }}',
              body: `
                ## 🚀 Production Release ${{ needs.production-build.outputs.version }}
                
                **Deployed to:** ${{ env.PRODUCTION_URL }}
                **Deployment Time:** ${new Date().toISOString()}
                
                ### Changes
                [View all changes](${compareUrl})
                
                ### Deployment Validation
                - ✅ Security scans passed
                - ✅ Performance tests passed
                - ✅ E2E tests passed
                - ✅ Health checks passed
                
                ### Rollback
                If rollback is needed, use the stored rollback artifacts from this deployment.
              `,
              draft: false,
              prerelease: false
            });

      - name: Update status page
        run: |
          # Update external status page
          curl -X POST "https://api.statuspage.io/v1/pages/${{ secrets.STATUSPAGE_PAGE_ID }}/incidents" \
          -H "Authorization: OAuth ${{ secrets.STATUSPAGE_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "incident": {
              "name": "Scheduled Maintenance - Platform Update",
              "status": "resolved",
              "body": "Platform has been successfully updated to version ${{ needs.production-build.outputs.version }}",
              "component_ids": ["${{ secrets.STATUSPAGE_COMPONENT_ID }}"],
              "incident_updates": [
                {
                  "body": "Deployment completed successfully. All services are operational.",
                  "status": "resolved"
                }
              ]
            }
          }'

  # Cleanup and Optimization
  cleanup:
    name: Cleanup and Optimization
    runs-on: ubuntu-latest
    needs: post-deployment
    if: always()

    steps:
      - name: Cleanup old deployments
        run: |
          # Keep only last 5 production images
          echo "Cleaning up old container images..."

      - name: Optimize resource usage
        run: |
          # Adjust resource allocations based on usage
          echo "Optimizing resource allocations..."

      - name: Archive deployment logs
        run: |
          # Archive logs for compliance
          echo "Archiving deployment logs..."

  # Failure Handling
  deployment-failure:
    name: Handle Deployment Failure
    runs-on: ubuntu-latest
    needs: [production-deploy, production-validation]
    if: failure()

    steps:
      - name: Automatic rollback
        run: |
          echo "Deployment failed, initiating automatic rollback..."
          # Implement automatic rollback to blue environment
          kubectl patch service storyplatform-app -n production -p '{"spec":{"selector":{"version":"blue"}}}'

      - name: Notify on-call team
        run: |
          curl -X POST "https://events.pagerduty.com/v2/enqueue" \
          -H "Content-Type: application/json" \
          -d '{
            "routing_key": "${{ secrets.PAGERDUTY_INTEGRATION_KEY }}",
            "event_action": "trigger",
            "payload": {
              "summary": "Production deployment failed - automatic rollback initiated",
              "severity": "critical",
              "source": "github-actions",
              "custom_details": {
                "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "version": "${{ needs.production-build.outputs.version }}"
              }
            }
          }'

      - name: Create incident report
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'INCIDENT: Production Deployment Failure - ' + context.sha.substring(0, 7),
              body: `
                ## 🚨 Production Deployment Incident
                
                **Severity:** Critical
                **Status:** Investigating
                **Started:** ${new Date().toISOString()}
                
                ### Incident Details
                - **Failed Deployment:** ${{ needs.production-build.outputs.version }}
                - **Commit:** ${context.sha}
                - **Run:** [${context.runNumber}](${context.payload.repository.html_url}/actions/runs/${context.runId})
                
                ### Actions Taken
                - Automatic rollback initiated
                - On-call team notified
                - Production traffic routed to stable version
                
                ### Next Steps
                - [ ] Investigate root cause
                - [ ] Fix deployment issues
                - [ ] Plan remediation deployment
                - [ ] Update incident documentation
              `,
              labels: ['incident', 'production', 'deployment-failure'],
              assignees: ['@on-call-team']
            });

      - name: Escalate to leadership
        if: github.ref == 'refs/heads/main'
        run: |
          # Send executive notification for main branch failures
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          -H 'Content-type: application/json' \
          --data '{
            "channel": "#leadership",
            "text": "🚨 CRITICAL: Production deployment failed",
            "attachments": [
              {
                "color": "danger",
                "title": "Production Deployment Failure",
                "text": "Automatic rollback initiated. On-call team notified.",
                "fields": [
                  {
                    "title": "Failed Version",
                    "value": "${{ needs.production-build.outputs.version }}",
                    "short": true
                  },
                  {
                    "title": "Run",
                    "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "short": true
                  }
                ]
              }
            ]
          }'