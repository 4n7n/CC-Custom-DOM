name: Deploy to Staging

on:
  push:
    branches: [ develop, feature/testing-deployment ]
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]

env:
  NODE_VERSION: '18.x'
  STAGING_URL: https://staging.storyplatform.com
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: storyplatform/app

jobs:
  # Code Quality and Security Checks
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run type checking
        run: npm run type-check

      - name: Security audit
        run: npm audit --audit-level high

      - name: Check for vulnerabilities
        run: |
          npx audit-ci --config .audit-ci.json
          npx snyk test --severity-threshold=high

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Unit and Integration Tests
  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: code-quality
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: testuser
          POSTGRES_DB: storyplatform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment
        run: |
          cp .env.test.example .env.test
          npm run db:migrate:test
          npm run db:seed:test

      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/storyplatform_test
          REDIS_URL: redis://localhost:6379

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/storyplatform_test
          REDIS_URL: redis://localhost:6379

      - name: Generate test coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Store test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            coverage/
          retention-days: 30

  # Build and Package
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test-suite
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          npm run build:staging
          npm run build:storybook

      - name: Run build tests
        run: npm run test:build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=staging-latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.staging
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            NODE_ENV=staging

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: ./sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: ./sbom.spdx.json

  # Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Snyk Container scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ needs.build.outputs.image-tag }}
          args: --severity-threshold=high

  # Infrastructure as Code
  infrastructure:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ./infrastructure/

      - name: Terraform Validate
        run: |
          cd infrastructure/staging
          terraform init -backend=false
          terraform validate

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./infrastructure/
          framework: terraform
          soft_fail: false

      - name: TFSec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: './infrastructure/'

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security-scan, infrastructure]
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/testing-deployment')
    
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name storyplatform-staging

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Deploy Infrastructure
        run: |
          cd infrastructure/staging
          terraform init
          terraform plan -var="image_tag=${{ needs.build.outputs.image-tag }}"
          terraform apply -auto-approve -var="image_tag=${{ needs.build.outputs.image-tag }}"

      - name: Deploy Application
        run: |
          envsubst < k8s/staging/deployment.yaml | kubectl apply -f -
          envsubst < k8s/staging/service.yaml | kubectl apply -f -
          envsubst < k8s/staging/ingress.yaml | kubectl apply -f -
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          ENVIRONMENT: staging

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/storyplatform-app -n staging --timeout=600s

      - name: Run database migrations
        run: |
          kubectl exec -n staging deployment/storyplatform-app -- npm run db:migrate

      - name: Verify deployment
        run: |
          kubectl get pods -n staging
          kubectl get services -n staging
          curl -f ${{ env.STAGING_URL }}/health || exit 1

  # End-to-End Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/testing-deployment')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Wait for staging deployment
        run: |
          timeout 300 bash -c 'until curl -f ${{ env.STAGING_URL }}/health; do sleep 5; done'

      - name: Run E2E tests
        run: npm run test:e2e:staging
        env:
          BASE_URL: ${{ env.STAGING_URL }}
          PLAYWRIGHT_HEADLESS: true

      - name: Run accessibility tests
        run: npm run test:a11y:staging
        env:
          BASE_URL: ${{ env.STAGING_URL }}

      - name: Run performance tests
        run: npm run test:performance:staging
        env:
          BASE_URL: ${{ env.STAGING_URL }}

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Upload screenshots
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: e2e-screenshots
          path: test-results/screenshots/
          retention-days: 7

  # Performance Testing
  performance-tests:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_SERVER_URL: ${{ env.STAGING_URL }}

      - name: Run load tests
        run: npm run test:load:staging
        env:
          BASE_URL: ${{ env.STAGING_URL }}

      - name: Generate performance report
        run: npm run performance:report
        
      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: performance-results/
          retention-days: 30

  # Staging Validation
  staging-validation:
    name: Staging Validation
    runs-on: ubuntu-latest
    needs: [e2e-tests, performance-tests]
    if: always() && (needs.e2e-tests.result == 'success' || needs.performance-tests.result == 'success')

    steps:
      - name: Validate staging environment
        run: |
          # Health check
          curl -f ${{ env.STAGING_URL }}/health
          
          # API validation
          curl -f ${{ env.STAGING_URL }}/api/health
          
          # Database connectivity
          curl -f ${{ env.STAGING_URL }}/api/status/database
          
          # Cache connectivity
          curl -f ${{ env.STAGING_URL }}/api/status/cache

      - name: Run smoke tests
        run: |
          # Basic functionality tests
          curl -f ${{ env.STAGING_URL }}/api/communities
          curl -f ${{ env.STAGING_URL }}/api/stories/featured

      - name: Validate SSL certificate
        run: |
          echo | openssl s_client -servername staging.storyplatform.com -connect staging.storyplatform.com:443 2>/dev/null | openssl x509 -noout -dates

  # Notifications
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [deploy-staging, e2e-tests, performance-tests, staging-validation]
    if: always()

    steps:
      - name: Notify Slack on Success
        if: needs.deploy-staging.result == 'success' && needs.e2e-tests.result == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          text: |
            ✅ Staging deployment successful!
            🚀 Branch: ${{ github.ref_name }}
            🔗 URL: ${{ env.STAGING_URL }}
            📊 All tests passed
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#deployments'
          text: |
            ❌ Staging deployment failed!
            🚀 Branch: ${{ github.ref_name }}
            📝 Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Create GitHub Issue on Failure
        if: failure() && github.ref == 'refs/heads/develop'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Staging Deployment Failure - ' + context.sha.substring(0, 7),
              body: `
                ## Staging Deployment Failed
                
                **Branch:** ${context.ref}
                **Commit:** ${context.sha}
                **Run:** [${context.runNumber}](${context.payload.repository.html_url}/actions/runs/${context.runId})
                
                Please investigate and fix the deployment issues.
              `,
              labels: ['bug', 'deployment', 'staging']
            });

  # Cleanup
  cleanup:
    name: Cleanup Resources
    runs-on: ubuntu-latest
    needs: [staging-validation]
    if: always()

    steps:
      - name: Cleanup old images
        run: |
          # Keep only last 10 images
          echo "Cleaning up old container images..."
          # Implementation would go here

      - name: Cleanup test data
        if: github.event_name == 'pull_request'
        run: |
          # Cleanup test data for PR environments
          echo "Cleaning up test data..."
          # Implementation would go here